[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant"
version = "0.1.0"
description = "Cross-platform, provider-agnostic LLM voice + chat assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ayush Patel" }]

# Core runtime dependencies (kept light so the package imports and the test
# suite runs without any cloud SDKs, audio libraries, or API keys).
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# The LLM gateway. One OpenAI-format API across Claude / OpenAI / Ollama / local.
llm = ["litellm>=1.40"]
# Knowledge & web skills.
knowledge = ["httpx>=0.27", "wikipedia>=1.4"]
# Productivity scheduling (timers / reminders / alarms).
productivity = ["APScheduler>=3.10"]
# System-control helpers (cross-platform brightness; volume is per-OS).
system = ["screen-brightness-control>=0.22"]
# Comms & media.
comms = ["spotipy>=2.23"]
# Voice stack (Phase 2).
voice = [
    "sounddevice>=0.4",
    "numpy>=1.26",
    "faster-whisper>=1.0",
    "edge-tts>=6.1",
    "openwakeword>=0.6",
]
# Web UI (Phase 3). uvicorn[standard] brings WebSocket support; httpx powers
# FastAPI's TestClient for the web tests.
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27"]
# Messaging bots (Phase 4).
bots = ["python-telegram-bot>=21.0"]
# Everything needed to actually run the assistant for real.
full = [
    "jarvis-assistant[llm,knowledge,productivity,system,comms]",
]
# Development / testing.
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
jarvis = ["config/*.toml", "interfaces/web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
